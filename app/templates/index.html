<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔍 AI Medical Chatbot</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 20% 20%, rgba(14, 165, 233, 0.35), transparent 35%),
                radial-gradient(circle at 80% 30%, rgba(139, 92, 246, 0.35), transparent 35%),
                radial-gradient(circle at 50% 90%, rgba(16, 185, 129, 0.22), transparent 35%),
                linear-gradient(135deg, #020617, #08111f 45%, #020617);
            color: #ffffff;
            padding: 2rem;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 45px 45px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0.1));
            pointer-events: none;
            z-index: -3;
        }

        .floating-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(8px);
            opacity: 0.55;
            z-index: -2;
            animation: floatOrb 12s ease-in-out infinite;
        }

        .orb-1 {
            width: 260px;
            height: 260px;
            background: #06b6d4;
            top: 10%;
            left: 8%;
        }

        .orb-2 {
            width: 320px;
            height: 320px;
            background: #7c3aed;
            bottom: 8%;
            right: 8%;
            animation-delay: 2s;
        }

        .orb-3 {
            width: 180px;
            height: 180px;
            background: #22c55e;
            top: 60%;
            left: 25%;
            animation-delay: 4s;
        }

        @keyframes floatOrb {
            0%, 100% {
                transform: translate3d(0, 0, 0) scale(1);
            }
            50% {
                transform: translate3d(35px, -45px, 80px) scale(1.12);
            }
        }

        .chat-container {
            max-width: 980px;
            height: calc(100vh - 4rem);
            margin: 0 auto;
            position: relative;

            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.14),
                rgba(255, 255, 255, 0.04)
            );

            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);

            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 34px;

            box-shadow:
                0 40px 90px rgba(0, 0, 0, 0.55),
                inset 0 1px 1px rgba(255, 255, 255, 0.18);

            overflow: hidden;
            display: flex;
            flex-direction: column;

            transform-style: preserve-3d;
            animation: containerEntry 0.8s ease forwards;
        }

        @keyframes containerEntry {
            from {
                opacity: 0;
                transform: perspective(1200px) rotateX(10deg) translateY(40px);
            }
            to {
                opacity: 1;
                transform: perspective(1200px) rotateX(0deg) translateY(0);
            }
        }

        .chat-container::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                120deg,
                transparent,
                rgba(255,255,255,0.12),
                transparent
            );
            transform: translateX(-100%);
            animation: glassShine 7s infinite;
            pointer-events: none;
        }

        @keyframes glassShine {
            0% {
                transform: translateX(-100%);
            }
            45%, 100% {
                transform: translateX(100%);
            }
        }

        h1 {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            padding: 1.4rem 1.6rem;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.055);
            position: relative;
        }

        h1::before {
            content: "";
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 35%, #ffffff, transparent 18%),
                linear-gradient(135deg, #06b6d4, #2563eb, #7c3aed);
            box-shadow:
                0 0 22px rgba(6, 182, 212, 0.9),
                0 0 55px rgba(124, 58, 237, 0.65);
            animation: aiPulse 2.8s ease-in-out infinite;
        }

        @keyframes aiPulse {
            0%, 100% {
                transform: scale(1) rotate(0deg);
                box-shadow:
                    0 0 22px rgba(6, 182, 212, 0.8),
                    0 0 55px rgba(124, 58, 237, 0.6);
            }
            50% {
                transform: scale(1.09) rotate(12deg);
                box-shadow:
                    0 0 35px rgba(6, 182, 212, 1),
                    0 0 80px rgba(124, 58, 237, 0.9);
            }
        }

        .error {
            margin: 1rem 1.5rem 0;
            padding: 0.9rem 1rem;
            border-radius: 16px;
            color: #fecaca;
            background: rgba(239, 68, 68, 0.13);
            border: 1px solid rgba(248, 113, 113, 0.35);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.18);
        }

        #chat-box {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        #chat-box::-webkit-scrollbar {
            width: 7px;
        }

        #chat-box::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background: linear-gradient(#06b6d4, #7c3aed);
            border-radius: 999px;
        }

        .message {
            margin-bottom: 1.2rem;
            padding: 1rem 1.1rem;
            border-radius: 22px;
            max-width: 78%;
            line-height: 1.55;
            font-size: 0.96rem;
            position: relative;
            animation: messagePop 0.45s ease both;
            transform-style: preserve-3d;
        }

        @keyframes messagePop {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message strong {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.8;
        }

        .user {
            margin-left: auto;
            text-align: right;
            color: #ffffff;
            background:
                linear-gradient(135deg, rgba(37, 99, 235, 0.95), rgba(124, 58, 237, 0.95));
            box-shadow:
                0 18px 40px rgba(79, 70, 229, 0.45),
                inset 0 1px 1px rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .assistant {
            text-align: left;
            color: #e5f6ff;
            background:
                linear-gradient(145deg, rgba(255,255,255,0.13), rgba(255,255,255,0.055));
            border: 1px solid rgba(255,255,255,0.13);
            box-shadow:
                0 18px 35px rgba(0,0,0,0.25),
                inset 0 1px 1px rgba(255,255,255,0.12);
        }

        form {
            margin-top: 0;
        }

        form[action*="index"] {
            padding: 1rem 1.5rem 1.2rem;
            border-top: 1px solid rgba(255,255,255,0.12);
            background: rgba(2, 6, 23, 0.28);
        }

        form[action*="index"]::before {
            content: "AI health assistant may make mistakes. Please consult a medical professional for serious symptoms.";
            display: block;
            font-size: 0.76rem;
            color: rgba(255,255,255,0.55);
            margin-bottom: 0.75rem;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 4.2rem;
            resize: none;
            padding: 1rem 1.1rem;
            font-size: 1rem;
            color: #ffffff;

            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 22px;

            outline: none;
            box-shadow:
                inset 0 1px 1px rgba(255,255,255,0.08),
                0 12px 30px rgba(0,0,0,0.22);

            transition: 0.3s ease;
        }

        textarea::placeholder {
            color: rgba(255,255,255,0.48);
        }

        textarea:focus {
            border-color: rgba(6, 182, 212, 0.75);
            box-shadow:
                0 0 0 4px rgba(6, 182, 212, 0.12),
                0 0 35px rgba(6, 182, 212, 0.22);
        }

        button {
            padding: 0.8rem 1.3rem;
            font-size: 0.95rem;
            font-weight: 700;
            margin-top: 0.75rem;
            border: none;
            border-radius: 999px;
            color: #ffffff;
            cursor: pointer;

            background: linear-gradient(135deg, #06b6d4, #2563eb, #7c3aed);
            box-shadow:
                0 16px 35px rgba(37, 99, 235, 0.38),
                inset 0 1px 1px rgba(255,255,255,0.25);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }

        button:hover {
            transform: translateY(-3px) scale(1.03);
            filter: brightness(1.08);
            box-shadow:
                0 22px 48px rgba(37, 99, 235, 0.5),
                0 0 35px rgba(6, 182, 212, 0.28);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        form[action*="clear"] {
            position: absolute;
            top: 1.15rem;
            right: 1.5rem;
            z-index: 5;
        }

        .clear-btn {
            margin-top: 0;
            padding: 0.7rem 1rem;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.16);
            backdrop-filter: blur(14px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        .clear-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            box-shadow:
                0 16px 35px rgba(239, 68, 68, 0.22),
                0 0 28px rgba(239, 68, 68, 0.18);
        }

        @media (max-width: 768px) {
            body {
                padding: 0.75rem;
            }

            .chat-container {
                height: calc(100vh - 1.5rem);
                border-radius: 24px;
            }

            h1 {
                font-size: 1.15rem;
                padding: 1rem;
                padding-right: 6rem;
            }

            h1::before {
                width: 38px;
                height: 38px;
            }

            .message {
                max-width: 92%;
                font-size: 0.9rem;
            }

            #chat-box {
                padding: 1rem;
            }

            form[action*="index"] {
                padding: 0.9rem;
            }

            .clear-btn {
                font-size: 0.75rem;
                padding: 0.55rem 0.75rem;
            }

            form[action*="clear"] {
                top: 1rem;
                right: 0.9rem;
            }
        }
    </style>
</head>

<body>

    <div class="floating-orb orb-1"></div>
    <div class="floating-orb orb-2"></div>
    <div class="floating-orb orb-3"></div>

    <div class="chat-container">
        <h1>🔍 AI Medical Chatbot New Change</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div id="chat-box">
            {% for msg in messages %}
                <div class="message {{ msg.role }}">
                    <strong>{{ msg.role|capitalize }}:</strong><br />
                    {{ msg.content | safe | nl2br }}
                </div>
            {% endfor %}
        </div>

         }}">
            <textarea name="prompt" placeholder="Ask a medical question..." required></textarea>
            <br />
            <button type="submit">Send</button>
        </form>

         }}">
            <button type="submit" class="clear-btn">Clear Chat</button>
        </form>
    </div>

</body>
</html>
